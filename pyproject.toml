[project]
name = "mastering-llm-deployment"
version = "0.2.0"
description = "Labs for the Mastering LLM Deployment course. Local instructor environment; Colab notebooks install their own packages."
readme = "README.md"
requires-python = ">=3.11"
# Same packages and lower bounds as requirements.txt. Change both together.
dependencies = [
    "openai>=1.57",
    "httpx>=0.25",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pyngrok>=7.0",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "transformers>=5",
    "torch>=2.4",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "peft>=0.14",
    "trl>=0.16",
    "datasets>=3.0",
    "torchao>=0.10",
    "sentence-transformers>=5.0",
    "chromadb>=1.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-community>=0.3,<0.4",
    "ragas>=0.3",
    "bm25s>=0.2",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "gradio>=6",
    "duckdb>=1.0",
